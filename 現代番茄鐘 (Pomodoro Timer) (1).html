<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>25:00 - 準備專注 | 番茄鐘</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google Fonts: Inter 與 Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body id="appBody" class="min-h-screen flex flex-col justify-between bg-rose-50 text-slate-800 transition-colors duration-500 selection:bg-rose-200">

  <!-- 頂部導覽列 -->
  <header class="w-full max-w-xl mx-auto px-4 pt-6 pb-2 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div id="brandBadge" class="w-9 h-9 rounded-xl bg-rose-500 text-white flex items-center justify-center shadow-sm transition-colors duration-500">
        <!-- 番茄圖示 SVG -->
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C11.1 2 10.3 2.5 9.9 3.3C8.8 2.8 7.5 3.1 6.8 4C6.1 4.9 6.2 6.2 7 7C4.2 8.2 2.5 11 2.5 14.2C2.5 18.8 6.7 22 12 22C17.3 22 21.5 18.8 21.5 14.2C21.5 11 19.8 8.2 17 7C17.8 6.2 17.9 4.9 17.2 4C16.5 3.1 15.2 2.8 14.1 3.3C13.7 2.5 12.9 2 12 2ZM12 4.5C12.3 4.5 12.6 4.7 12.7 5L13.2 6.1L14.4 5.7C14.7 5.6 15.1 5.7 15.3 6C15.5 6.3 15.4 6.7 15.1 6.9L14.2 7.6L15.2 8.1C17.5 9.1 19 11.4 19 14.2C19 17.3 15.9 19.5 12 19.5C8.1 19.5 5 17.3 5 14.2C5 11.4 6.5 9.1 8.8 8.1L9.8 7.6L8.9 6.9C8.6 6.7 8.5 6.3 8.7 6C8.9 5.7 9.3 5.6 9.6 5.7L10.8 6.1L11.3 5C11.4 4.7 11.7 4.5 12 4.5Z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight leading-none">番茄專注鐘</h1>
        <p class="text-xs text-slate-500 mt-0.5">高效工作與節奏管理</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- 音效開關按鈕 -->
      <button id="soundToggleBtn" type="button" title="切換提示音" class="p-3 rounded-xl bg-white/80 hover:bg-white text-slate-600 shadow-sm border border-slate-200/60 transition active:scale-95">
        <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" />
        </svg>
        <svg id="soundOffIcon" class="w-5 h-5 hidden text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6" />
        </svg>
      </button>

      <!-- 設定按鈕 -->
      <button id="openSettingsBtn" type="button" title="時間設定" class="p-3 rounded-xl bg-white/80 hover:bg-white text-slate-600 shadow-sm border border-slate-200/60 transition active:scale-95 flex items-center gap-1.5 text-sm font-medium">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="hidden sm:inline">設定</span>
      </button>
    </div>
  </header>

  <!-- 主要計時卡片區 -->
  <main class="w-full max-w-xl mx-auto px-4 py-4 flex-1 flex flex-col justify-center">
    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl shadow-slate-900/5 border border-white p-6 sm:p-8 flex flex-col items-center">

      <!-- 模式切換標籤列 -->
      <div class="w-full grid grid-cols-3 gap-1.5 p-1.5 bg-slate-100/90 rounded-2xl mb-6" role="tablist">
        <button type="button" data-mode="focus" class="mode-tab py-2.5 px-2 rounded-xl text-sm sm:text-base font-bold transition-all duration-300 bg-rose-500 text-white shadow-sm">
          專注
        </button>
        <button type="button" data-mode="shortBreak" class="mode-tab py-2.5 px-2 rounded-xl text-sm sm:text-base font-semibold text-slate-600 hover:text-slate-900 transition-all duration-300">
          短休息
        </button>
        <button type="button" data-mode="longBreak" class="mode-tab py-2.5 px-2 rounded-xl text-sm sm:text-base font-semibold text-slate-600 hover:text-slate-900 transition-all duration-300">
          長休息
        </button>
      </div>

      <!-- 圓形進度環與大字體時間顯示 -->
      <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-2">
        <!-- SVG 圓形進度條 -->
        <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 260 260">
          <!-- 背景底環 -->
          <circle
            cx="130"
            cy="130"
            r="116"
            fill="none"
            stroke="currentColor"
            stroke-width="10"
            class="text-slate-100"
          />
          <!-- 動態進度環 -->
          <circle
            id="progressRing"
            cx="130"
            cy="130"
            r="116"
            fill="none"
            stroke="currentColor"
            stroke-width="10"
            stroke-linecap="round"
            stroke-dasharray="728.85"
            stroke-dashoffset="0"
            class="text-rose-500 transition-all duration-300 ease-linear"
          />
        </svg>

        <!-- 中央文字區 -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4">
          <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold tracking-wide bg-rose-100 text-rose-700 mb-2 transition-colors duration-500">
            <span id="statusDot" class="w-2 h-2 rounded-full bg-rose-500"></span>
            <span id="statusText">專注時間</span>
          </span>

          <!-- 超大等寬數字剩餘時間 -->
          <div id="timeDisplay" class="text-6xl sm:text-7xl font-extrabold tracking-tight text-slate-800 tabular-nums select-none leading-none my-1">
            25:00
          </div>

          <!-- 下一階段預告 -->
          <p id="nextPhaseHint" class="text-xs sm:text-sm text-slate-400 font-medium mt-2">
            結束後進入 5 分鐘短休息
          </p>
        </div>
      </div>

      <!-- 4 顆番茄週期進度指示器 -->
      <div class="w-full flex flex-col items-center mt-5 mb-7">
        <div class="flex items-center gap-3" id="pomodoroDots" aria-label="專注週期進度">
          <!-- 由 JS 動態渲染 4 顆番茄指示燈 -->
        </div>
        <p id="cycleSummaryText" class="text-xs text-slate-500 mt-2 font-medium">
          本輪已完成 <span class="font-bold text-slate-700">0</span> / 4 個專注（累計 0 次）
        </p>
      </div>

      <!-- 主要控制按鈕群（大尺寸觸控友善） -->
      <div class="w-full flex items-center justify-center gap-3 sm:gap-4">
        <!-- 重設按鈕 -->
        <button id="resetBtn" type="button" title="重設目前時間" class="p-4 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold transition active:scale-95 flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span class="sr-only">重設</span>
        </button>

        <!-- 開始 / 暫停 主按鈕 -->
        <button id="startPauseBtn" type="button" class="flex-1 max-w-[220px] py-4 px-6 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white text-lg sm:text-xl font-bold shadow-lg shadow-rose-500/25 transition-all duration-300 active:scale-95 flex items-center justify-center gap-2.5">
          <svg id="playIcon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg id="pauseIcon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
          <span id="startPauseText">開始專注</span>
        </button>

        <!-- 跳過階段按鈕 -->
        <button id="skipBtn" type="button" title="跳至下一階段" class="p-4 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold transition active:scale-95 flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
          </svg>
          <span class="sr-only">跳過階段</span>
        </button>
      </div>

    </div>
  </main>

  <!-- 底部提示資訊 -->
  <footer class="w-full max-w-xl mx-auto px-4 pb-6 pt-2 text-center">
    <p class="text-xs text-slate-400">
      每完成 4 個專注週期自動進入長休息 · 時間到自動切換並響鈴提醒
    </p>
  </footer>

  <!-- Toast 通知訊息框 (取代 alert) -->
  <div id="toastBanner" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 -translate-y-4 transition-all duration-300 w-[90%] max-w-sm">
    <div class="bg-slate-900/95 text-white px-4 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 backdrop-blur-md">
      <span id="toastIcon" class="text-xl">🍅</span>
      <div class="flex-1 text-sm font-medium" id="toastMessage">時間到！切換至休息模式</div>
    </div>
  </div>

  <!-- 自訂時間設定 Modal 彈窗 -->
  <div id="settingsModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 backdrop-blur-xs p-4">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl border border-slate-100 overflow-hidden animate-[fadeIn_0.2s_ease-out]">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-800">計時器設定</h2>
        <button id="closeSettingsBtn" type="button" class="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="settingsForm" class="p-6 space-y-5">
        <!-- 時間設定欄位 -->
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label for="focusMinutesInput" class="block text-xs font-bold text-rose-600 mb-1.5">專注 (分鐘)</label>
            <input id="focusMinutesInput" type="number" min="1" max="120" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-center text-lg font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:bg-white transition" />
          </div>
          <div>
            <label for="shortBreakMinutesInput" class="block text-xs font-bold text-emerald-600 mb-1.5">短休息 (分鐘)</label>
            <input id="shortBreakMinutesInput" type="number" min="1" max="60" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-center text-lg font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" />
          </div>
          <div>
            <label for="longBreakMinutesInput" class="block text-xs font-bold text-sky-600 mb-1.5">長休息 (分鐘)</label>
            <input id="longBreakMinutesInput" type="number" min="1" max="90" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-center text-lg font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition" />
          </div>
        </div>

        <!-- 自動連續計時與提示音測試 -->
        <div class="space-y-3 pt-2 border-t border-slate-100">
          <label class="flex items-center justify-between cursor-pointer py-1">
            <div>
              <span class="text-sm font-bold text-slate-700 block">時間到自動開始下一階段</span>
              <span class="text-xs text-slate-400">切換模式後無需手動點擊即自動倒數</span>
            </div>
            <input id="autoStartInput" type="checkbox" checked class="w-5 h-5 rounded accent-rose-500 cursor-pointer" />
          </label>

          <div class="flex items-center justify-between pt-1">
            <div>
              <span class="text-sm font-bold text-slate-700 block">提示音效測試</span>
              <span class="text-xs text-slate-400">確認手機或電腦音量是否正常</span>
            </div>
            <button id="testSoundBtn" type="button" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition active:scale-95 flex items-center gap-1.5">
              <span>🔔</span> 試聽提示音
            </button>
          </div>
        </div>

        <!-- 底部儲存與恢復預設按鈕 -->
        <div class="flex items-center justify-between gap-3 pt-3">
          <button id="restoreDefaultsBtn" type="button" class="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 transition">
            恢復預設 (25/5/15)
          </button>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold shadow-md transition active:scale-95">
            儲存並套用
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    /**
     * 番茄鐘核心應用程式邏輯
     * 特色：精準時間戳記差值計算、Web Audio API 合成音效、自動 4 週期長休息循環、RWD 與主題色動態切換
     */
    (function () {
      // 儲存鍵名
      const STORAGE_KEY = 'pomodoro_app_settings_v1';

      // 預設設定值
      const DEFAULT_SETTINGS = {
        focus: 25,
        shortBreak: 5,
        longBreak: 15,
        autoStart: true,
        soundEnabled: true,
      };

      // 各模式的主題配置
      const THEME_CONFIG = {
        focus: {
          label: '專注時間',
          shortLabel: '專注',
          runningTitle: '專注中',
          pausedTitle: '已暫停',
          startBtnText: '開始專注',
          bodyBg: 'bg-rose-50',
          brandBg: 'bg-rose-500',
          tabActiveBg: 'bg-rose-500',
          ringColor: 'text-rose-500',
          badgeBg: 'bg-rose-100',
          badgeText: 'text-rose-700',
          dotColor: 'bg-rose-500',
          btnBg: 'bg-rose-500 hover:bg-rose-600 shadow-rose-500/25',
        },
        shortBreak: {
          label: '短休息時間',
          shortLabel: '短休息',
          runningTitle: '短休息中',
          pausedTitle: '休息暫停',
          startBtnText: '開始短休息',
          bodyBg: 'bg-emerald-50',
          brandBg: 'bg-emerald-500',
          tabActiveBg: 'bg-emerald-500',
          ringColor: 'text-emerald-500',
          badgeBg: 'bg-emerald-100',
          badgeText: 'text-emerald-700',
          dotColor: 'bg-emerald-500',
          btnBg: 'bg-emerald-500 hover:bg-emerald-600 shadow-emerald-500/25',
        },
        longBreak: {
          label: '長休息時間',
          shortLabel: '長休息',
          runningTitle: '長休息中',
          pausedTitle: '長休息暫停',
          startBtnText: '開始長休息',
          bodyBg: 'bg-sky-50',
          brandBg: 'bg-sky-500',
          tabActiveBg: 'bg-sky-500',
          ringColor: 'text-sky-500',
          badgeBg: 'bg-sky-100',
          badgeText: 'text-sky-700',
          dotColor: 'bg-sky-500',
          btnBg: 'bg-sky-500 hover:bg-sky-600 shadow-sky-500/25',
        },
      };

      // 應用程式狀態
      let settings = loadSettings();
      let currentMode = 'focus'; // 'focus' | 'shortBreak' | 'longBreak'
      let isRunning = false;
      let totalSeconds = settings.focus * 60;
      let remainingSeconds = totalSeconds;
      let endTimeStamp = null; // 精準計時目標時間戳記 (ms)
      let timerInterval = null;
      let completedFocusInCycle = 0; // 當前 4 次循環內已完成的專注次數 (0 ~ 4)
      let totalCompletedFocus = 0;   // 總累計完成專注次數
      let audioCtx = null;           // Web Audio API Context
      let toastTimeout = null;

      // 圓環周長 (2 * PI * 116)
      const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 116;

      // DOM 元素快取
      const els = {
        appBody: document.getElementById('appBody'),
        brandBadge: document.getElementById('brandBadge'),
        modeTabs: document.querySelectorAll('.mode-tab'),
        progressRing: document.getElementById('progressRing'),
        statusBadge: document.getElementById('statusBadge'),
        statusDot: document.getElementById('statusDot'),
        statusText: document.getElementById('statusText'),
        timeDisplay: document.getElementById('timeDisplay'),
        nextPhaseHint: document.getElementById('nextPhaseHint'),
        pomodoroDots: document.getElementById('pomodoroDots'),
        cycleSummaryText: document.getElementById('cycleSummaryText'),
        startPauseBtn: document.getElementById('startPauseBtn'),
        startPauseText: document.getElementById('startPauseText'),
        playIcon: document.getElementById('playIcon'),
        pauseIcon: document.getElementById('pauseIcon'),
        resetBtn: document.getElementById('resetBtn'),
        skipBtn: document.getElementById('skipBtn'),
        soundToggleBtn: document.getElementById('soundToggleBtn'),
        soundOnIcon: document.getElementById('soundOnIcon'),
        soundOffIcon: document.getElementById('soundOffIcon'),
        openSettingsBtn: document.getElementById('openSettingsBtn'),
        closeSettingsBtn: document.getElementById('closeSettingsBtn'),
        settingsModal: document.getElementById('settingsModal'),
        settingsForm: document.getElementById('settingsForm'),
        focusMinutesInput: document.getElementById('focusMinutesInput'),
        shortBreakMinutesInput: document.getElementById('shortBreakMinutesInput'),
        longBreakMinutesInput: document.getElementById('longBreakMinutesInput'),
        autoStartInput: document.getElementById('autoStartInput'),
        testSoundBtn: document.getElementById('testSoundBtn'),
        restoreDefaultsBtn: document.getElementById('restoreDefaultsBtn'),
        toastBanner: document.getElementById('toastBanner'),
        toastIcon: document.getElementById('toastIcon'),
        toastMessage: document.getElementById('toastMessage'),
      };

      /**
       * 從 localStorage 讀取設定
       */
      function loadSettings() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            return { ...DEFAULT_SETTINGS, ...JSON.parse(saved) };
          }
        } catch (err) {
          console.warn('讀取設定失敗，使用預設值:', err);
        }
        return { ...DEFAULT_SETTINGS };
      }

      /**
       * 儲存設定至 localStorage
       */
      function saveSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (err) {
          console.warn('儲存設定失敗:', err);
        }
      }

      /**
       * 初始化或解鎖 Web Audio API (解決行動裝置自動播放限制)
       */
      function initAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      }

      /**
       * 使用 Web Audio API 播放清脆悅耳的和弦提示音
       * @param {'focusEnd' | 'breakEnd'} type 音效類型
       */
      function playChimeSound(type = 'focusEnd') {
        if (!settings.soundEnabled) return;
        initAudioContext();
        if (!audioCtx) return;

        try {
          const now = audioCtx.currentTime;
          // 專注結束播放明亮上行三連音 (C5 -> E5 -> G5 -> C6)
          // 休息結束播放柔和提醒音 (G5 -> E5 -> C5)
          const notes = type === 'focusEnd'
            ? [523.25, 659.25, 783.99, 1046.50]
            : [783.99, 659.25, 523.25];

          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.14);

            // 音量包絡線：快速起音、平滑衰減，避免爆音
            gain.gain.setValueAtTime(0.001, now + idx * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.28, now + idx * 0.14 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 0.55);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now + idx * 0.14);
            osc.stop(now + idx * 0.14 + 0.6);
          });
        } catch (err) {
          console.warn('音效播放失敗:', err);
        }
      }

      /**
       * 顯示頂部 Toast 輕量通知 (取代原生 alert)
       */
      function showToast(message, icon = '🍅') {
        els.toastMessage.textContent = message;
        els.toastIcon.textContent = icon;
        els.toastBanner.classList.remove('opacity-0', '-translate-y-4');
        els.toastBanner.classList.add('opacity-100', 'translate-y-0');

        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          els.toastBanner.classList.remove('opacity-100', 'translate-y-0');
          els.toastBanner.classList.add('opacity-0', '-translate-y-4');
        }, 3800);
      }

      /**
       * 格式化秒數為 MM:SS
       */
      function formatTime(sec) {
        const safeSec = Math.max(0, Math.ceil(sec));
        const m = Math.floor(safeSec / 60);
        const s = safeSec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      /**
       * 更新瀏覽器分頁標題
       */
      function updateDocumentTitle() {
        const timeStr = formatTime(remainingSeconds);
        const theme = THEME_CONFIG[currentMode];
        const stateLabel = isRunning ? theme.runningTitle : theme.shortLabel;
        document.title = `${timeStr} - ${stateLabel} | 番茄鐘`;
      }

      /**
       * 更新圓形進度環
       */
      function updateProgressRing() {
        const ratio = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
        const offset = CIRCLE_CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, ratio)));
        els.progressRing.style.strokeDasharray = `${CIRCLE_CIRCUMFERENCE}`;
        els.progressRing.style.strokeDashoffset = `${offset}`;
      }

      /**
       * 渲染 4 顆番茄進度指示器與文字
       */
      function renderCycleIndicator() {
        els.pomodoroDots.innerHTML = '';
        for (let i = 0; i < 4; i++) {
          const isCompleted = i < completedFocusInCycle;
          const isCurrent = !isCompleted && i === completedFocusInCycle && currentMode === 'focus';

          const dot = document.createElement('div');
          dot.className = `w-8 h-8 rounded-full flex items-center justify-center transition-all duration-300 ${
            isCompleted
              ? 'bg-rose-500 text-white shadow-sm scale-105'
              : isCurrent
              ? 'bg-rose-100 text-rose-500 ring-2 ring-rose-400'
              : 'bg-slate-100 text-slate-300'
          }`;
          dot.title = isCompleted ? `第 ${i + 1} 個專注已完成` : `第 ${i + 1} 個專注`;
          dot.innerHTML = `
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C11.1 2 10.3 2.5 9.9 3.3C8.8 2.8 7.5 3.1 6.8 4C6.1 4.9 6.2 6.2 7 7C4.2 8.2 2.5 11 2.5 14.2C2.5 18.8 6.7 22 12 22C17.3 22 21.5 18.8 21.5 14.2C21.5 11 19.8 8.2 17 7C17.8 6.2 17.9 4.9 17.2 4C16.5 3.1 15.2 2.8 14.1 3.3C13.7 2.5 12.9 2 12 2Z"/>
            </svg>
          `;
          els.pomodoroDots.appendChild(dot);
        }

        els.cycleSummaryText.innerHTML = `本輪已完成 <span class="font-bold text-slate-700">${completedFocusInCycle}</span> / 4 個專注（累計 ${totalCompletedFocus} 次）`;
      }

      /**
       * 更新下一階段預告文字
       */
      function updateNextPhaseHint() {
        if (currentMode === 'focus') {
          const willBeLongBreak = (completedFocusInCycle + 1) >= 4;
          if (willBeLongBreak) {
            els.nextPhaseHint.textContent = `完成本次後進入 ${settings.longBreak} 分鐘長休息 🎉`;
          } else {
            els.nextPhaseHint.textContent = `結束後進入 ${settings.shortBreak} 分鐘短休息`;
          }
        } else {
          els.nextPhaseHint.textContent = `休息結束後回到 ${settings.focus} 分鐘專注`;
        }
      }

      /**
       * 套用目前模式的主題色調與 UI 狀態
       */
      function applyThemeAndUI() {
        const theme = THEME_CONFIG[currentMode];

        // 切換背景與品牌色
        els.appBody.className = `min-h-screen flex flex-col justify-between ${theme.bodyBg} text-slate-800 transition-colors duration-500 selection:bg-rose-200`;
        els.brandBadge.className = `w-9 h-9 rounded-xl ${theme.brandBg} text-white flex items-center justify-center shadow-sm transition-colors duration-500`;

        // 切換模式標籤樣式
        els.modeTabs.forEach((tab) => {
          const tabMode = tab.dataset.mode;
          if (tabMode === currentMode) {
            tab.className = `mode-tab py-2.5 px-2 rounded-xl text-sm sm:text-base font-bold transition-all duration-300 ${theme.tabActiveBg} text-white shadow-sm`;
          } else {
            tab.className = 'mode-tab py-2.5 px-2 rounded-xl text-sm sm:text-base font-semibold text-slate-600 hover:text-slate-900 transition-all duration-300';
          }
        });

        // 圓環顏色與狀態標籤
        els.progressRing.setAttribute('class', `${theme.ringColor} transition-all duration-300 ease-linear`);
        els.statusBadge.className = `inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold tracking-wide ${theme.badgeBg} ${theme.badgeText} mb-2 transition-colors duration-500`;
        els.statusDot.className = `w-2 h-2 rounded-full ${theme.dotColor} ${isRunning ? 'animate-ping' : ''}`;
        els.statusText.textContent = theme.label;

        // 主操作按鈕樣式與文字
        els.startPauseBtn.className = `flex-1 max-w-[220px] py-4 px-6 rounded-2xl ${theme.btnBg} text-white text-lg sm:text-xl font-bold shadow-lg transition-all duration-300 active:scale-95 flex items-center justify-center gap-2.5`;
        if (isRunning) {
          els.playIcon.classList.add('hidden');
          els.pauseIcon.classList.remove('hidden');
          els.startPauseText.textContent = '暫停';
        } else {
          els.playIcon.classList.remove('hidden');
          els.pauseIcon.classList.add('hidden');
          els.startPauseText.textContent = remainingSeconds < totalSeconds ? '繼續' : theme.startBtnText;
        }

        // 音效圖示狀態
        if (settings.soundEnabled) {
          els.soundOnIcon.classList.remove('hidden');
          els.soundOffIcon.classList.add('hidden');
        } else {
          els.soundOnIcon.classList.add('hidden');
          els.soundOffIcon.classList.remove('hidden');
        }

        // 更新時間文字、進度環、番茄點點與分頁標題
        els.timeDisplay.textContent = formatTime(remainingSeconds);
        updateProgressRing();
        renderCycleIndicator();
        updateNextPhaseHint();
        updateDocumentTitle();
      }

      /**
       * 切換到指定模式
       * @param {'focus' | 'shortBreak' | 'longBreak'} mode
       * @param {boolean} autoStart 是否自動開始計時
       */
      function switchMode(mode, autoStart = false) {
        stopTimerInterval();
        isRunning = false;
        currentMode = mode;

        const minutes = settings[mode];
        totalSeconds = minutes * 60;
        remainingSeconds = totalSeconds;
        endTimeStamp = null;

        applyThemeAndUI();

        if (autoStart) {
          startTimer();
        }
      }

      /**
       * 啟動計時器（採用時間戳記差值法，防止背景分頁節流延遲）
       */
      function startTimer() {
        if (isRunning) return;
        initAudioContext(); // 趁使用者互動時解鎖音效

        isRunning = true;
        endTimeStamp = Date.now() + remainingSeconds * 1000;
        applyThemeAndUI();

        timerInterval = setInterval(() => {
          const now = Date.now();
          const diffMs = endTimeStamp - now;
          remainingSeconds = Math.max(0, Math.ceil(diffMs / 1000));

          els.timeDisplay.textContent = formatTime(remainingSeconds);
          updateProgressRing();
          updateDocumentTitle();

          if (remainingSeconds <= 0) {
            handlePhaseComplete();
          }
        }, 250);
      }

      /**
       * 暫停計時器
       */
      function pauseTimer() {
        if (!isRunning) return;
        stopTimerInterval();
        // 結算精準剩餘秒數
        if (endTimeStamp) {
          remainingSeconds = Math.max(0, Math.ceil((endTimeStamp - Date.now()) / 1000));
        }
        isRunning = false;
        endTimeStamp = null;
        applyThemeAndUI();
      }

      /**
       * 清除計時 Interval
       */
      function stopTimerInterval() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      /**
       * 重設目前階段時間
       */
      function resetTimer() {
        stopTimerInterval();
        isRunning = false;
        endTimeStamp = null;
        totalSeconds = settings[currentMode] * 60;
        remainingSeconds = totalSeconds;
        applyThemeAndUI();
      }

      /**
       * 處理單一階段倒數結束後的自動切換邏輯
       */
      function handlePhaseComplete() {
        stopTimerInterval();
        isRunning = false;
        endTimeStamp = null;

        if (currentMode === 'focus') {
          // 播放專注完成提示音
          playChimeSound('focusEnd');

          completedFocusInCycle += 1;
          totalCompletedFocus += 1;

          if (completedFocusInCycle >= 4) {
            // 完成第 4 個專注，進入長休息
            showToast(`太棒了！完成 4 個專注，進入 ${settings.longBreak} 分鐘長休息`, '🎉');
            switchMode('longBreak', settings.autoStart);
          } else {
            // 進入短休息
            showToast(`專注完成！休息 ${settings.shortBreak} 分鐘吧`, '☕');
            switchMode('shortBreak', settings.autoStart);
          }
        } else {
          // 播放休息結束提示音
          playChimeSound('breakEnd');

          // 若剛結束的是長休息，重置本輪 4 顆番茄計數
          if (currentMode === 'longBreak') {
            completedFocusInCycle = 0;
          }

          showToast(`休息結束！準備開始 ${settings.focus} 分鐘專注`, '🍅');
          switchMode('focus', settings.autoStart);
        }
      }

      /**
       * 開啟設定面板並填入目前數值
       */
      function openSettingsModal() {
        els.focusMinutesInput.value = settings.focus;
        els.shortBreakMinutesInput.value = settings.shortBreak;
        els.longBreakMinutesInput.value = settings.longBreak;
        els.autoStartInput.checked = settings.autoStart;

        els.settingsModal.classList.remove('hidden');
        els.settingsModal.classList.add('flex');
      }

      /**
       * 關閉設定面板
       */
      function closeSettingsModal() {
        els.settingsModal.classList.add('hidden');
        els.settingsModal.classList.remove('flex');
      }

      // ================= 事件監聽綁定 =================

      // 開始 / 暫停主按鈕
      els.startPauseBtn.addEventListener('click', () => {
        if (isRunning) {
          pauseTimer();
        } else {
          startTimer();
        }
      });

      // 重設按鈕
      els.resetBtn.addEventListener('click', () => {
        resetTimer();
        showToast('已重設目前階段時間', '🔄');
      });

      // 跳過目前階段按鈕
      els.skipBtn.addEventListener('click', () => {
        initAudioContext();
        handlePhaseComplete();
      });

      // 頂部模式切換標籤
      els.modeTabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          const targetMode = tab.dataset.mode;
          if (targetMode && targetMode !== currentMode) {
            // 若手動切回專注且剛完成一輪 4 顆，重設本輪計數
            if (targetMode === 'focus' && completedFocusInCycle >= 4) {
              completedFocusInCycle = 0;
            }
            switchMode(targetMode, false);
          }
        });
      });

      // 音效開關切換
      els.soundToggleBtn.addEventListener('click', () => {
        settings.soundEnabled = !settings.soundEnabled;
        saveSettings();
        applyThemeAndUI();
        if (settings.soundEnabled) {
          playChimeSound('focusEnd');
          showToast('提示音效已開啟', '🔔');
        } else {
          showToast('提示音效已靜音', '🔇');
        }
      });

      // 設定彈窗控制
      els.openSettingsBtn.addEventListener('click', openSettingsModal);
      els.closeSettingsBtn.addEventListener('click', closeSettingsModal);
      els.settingsModal.addEventListener('click', (e) => {
        if (e.target === els.settingsModal) {
          closeSettingsModal();
        }
      });

      // 試聽提示音按鈕
      els.testSoundBtn.addEventListener('click', () => {
        const prevSoundState = settings.soundEnabled;
        settings.soundEnabled = true;
        playChimeSound('focusEnd');
        settings.soundEnabled = prevSoundState;
      });

      // 恢復預設時間按鈕
      els.restoreDefaultsBtn.addEventListener('click', () => {
        els.focusMinutesInput.value = DEFAULT_SETTINGS.focus;
        els.shortBreakMinutesInput.value = DEFAULT_SETTINGS.shortBreak;
        els.longBreakMinutesInput.value = DEFAULT_SETTINGS.longBreak;
        els.autoStartInput.checked = DEFAULT_SETTINGS.autoStart;
      });

      // 儲存設定表單送出
      els.settingsForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const newFocus = Math.max(1, Math.min(120, parseInt(els.focusMinutesInput.value, 10) || 25));
        const newShort = Math.max(1, Math.min(60, parseInt(els.shortBreakMinutesInput.value, 10) || 5));
        const newLong = Math.max(1, Math.min(90, parseInt(els.longBreakMinutesInput.value, 10) || 15));

        settings.focus = newFocus;
        settings.shortBreak = newShort;
        settings.longBreak = newLong;
        settings.autoStart = els.autoStartInput.checked;

        saveSettings();
        closeSettingsModal();

        // 若目前未在計時中，立即更新當前顯示的時間
        if (!isRunning) {
          totalSeconds = settings[currentMode] * 60;
          remainingSeconds = totalSeconds;
        }
        applyThemeAndUI();
        showToast('設定已儲存並套用', '✅');
      });

      // 頁面可見度改變時立即校正時間（針對手機鎖屏或切換分頁恢復時）
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && isRunning && endTimeStamp) {
          const diffMs = endTimeStamp - Date.now();
          remainingSeconds = Math.max(0, Math.ceil(diffMs / 1000));
          els.timeDisplay.textContent = formatTime(remainingSeconds);
          updateProgressRing();
          updateDocumentTitle();
          if (remainingSeconds <= 0) {
            handlePhaseComplete();
          }
        }
      });

      // 初始畫面渲染
      applyThemeAndUI();
    })();
  </script>
</body>
</html>
